<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile Box</title>
  <link rel="stylesheet" href="pResponsive.css">
  <script src="p.js" defer></script>
</head>

<body>
  <div class="header">
    <a href="main.html" class="back-link">Go Back</a>
    <!-- <img src="images/logo2.png" alt="CINESCOPE Logo" class="logo"> -->
  </div>

  <div class="profile-box">
    <div class="profile-header">
      <img src="images/profile.jpg" alt="Profile Image" class="profile-image">
      <div class="profile-details">
        <div class="profile-name">DAMON SALVATORE</div>
        <div class="username">damon1890</div>
        <div class="profile-email">damon1890@gmail.com</div>
        <button class="edit-profile" onclick="window.location.href='editP.html'">Edit profile</button>
      </div>
    </div>

    <div class="reviews-bio-container">
      <div class="bio-section">
        <div class="bio-label">BIO:</div>
        <textarea class="bio-text" id="bio-text" readonly>This is your bio. Add any information you'd like to share!</textarea>
      </div>
      <div class="reviews">
        <p class="reviews-label">REVIEWS<br>SUBMITTED</p>
        <div class="reviews-count">15</div>
      </div>
    </div>

    <div class="favorites-section">
      <div class="favorites-label">MY FAVORITES</div>
      <div class="favorites-container">
        <div class="movie">
          <img src="images/venom.png" alt="Venom" class="movie-image">
          <div class="stars">⭐⭐⭐⭐⭐</div>
        </div>
        <div class="movie">
          <img src="images/ai_dharma_story.png" alt="The A.I. Dharma Story" class="movie-image">
          <div class="stars">⭐⭐⭐⭐</div>
        </div>
        <div class="movie">
          <img src="images/tigra.png" alt="Tigra" class="movie-image">
          <div class="stars">⭐⭐⭐⭐</div>
        </div>
        <div class="movie">
          <img src="images/wild_robot.png" alt="Wild Robot" class="movie-image">
          <div class="stars">⭐⭐⭐⭐⭐</div>
        </div>
        <div class="movie">
          <img src="images/stranger_things.png" alt="Stranger Things" class="movie-image">
          <div class="stars">⭐⭐⭐⭐⭐</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
