<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: url('./images/background_main_page.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
        }
        
        .container {
            background-color: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 15px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.6);
        }

        .profile-pic {
            width: 120px;
            height: 120px;
            overflow: hidden;
            margin: 0 auto;
            position: relative;
            transition: transform 0.2s;
        }

        .profile-pic:hover {
            transform: scale(1.05);
        }

        .profile-pic img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: block;
        }

        .add-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 20px;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-align: center;
        }

        .add-icon input[type="file"] {
            display: none;
        }

        form {
            margin-top: 20px;
        }

        input[type="text"], input[type="email"], input[type="date"], textarea {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.3);
            color: #fff;
            font-size: 18px;
        }

        input[type="text"]::placeholder, input[type="email"]::placeholder, input[type="date"]::placeholder, textarea::placeholder {
            color: #ccc;
        }

        .update-button {
            background: linear-gradient(90deg, #4caf50, #2e7d32);
            color: #fff;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            width: 100%;
        }

        .update-button:hover {
            background-color: #333;
            transform: scale(1.05);
        }

        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 16px;
            text-decoration: none;
            color: #fff;
            display: flex;
            align-items: center;
        }

        .back-link:before {
            content: "←";
            margin-right: 5px;
        }

        @media (max-width: 480px) {
            .container {
                width: 90%;
            }
        }
    </style>
</head>
<body>

    <a href="profile.html" class="back-link">Go Back</a>

    <div class="container">
        <div class="profile-pic">
            <img src="profile-picture.jpg" alt="" id="profileImage">
            <label class="add-icon">
                Add Profile
                <input type="file" accept="image/*" onchange="previewImage(event)">
            </label>
        </div>
        
        <form>
            <input type="text" placeholder="Name" required>
            <input type="text" placeholder="Username" required>
            <input type="email" placeholder="Email" required>
            <input type="date" placeholder="DOB" required>
            <textarea placeholder="Bio" rows="4"></textarea>
            <button type="submit" class="update-button">Update</button>
        </form>
    </div>

    <script>
        function previewImage(event) {
            const profileImage = document.getElementById('profileImage');
            profileImage.src = URL.createObjectURL(event.target.files[0]);
            profileImage.onload = () => URL.revokeObjectURL(profileImage.src);
        }
    </script>

</body>
</html>
